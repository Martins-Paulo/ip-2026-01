<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Paciente</title>
    <link rel="stylesheet" href="../styles/index.style.css">
</head>
<body>
    <main>
        <h1>Ficha de Cadastro de Paciente</h1>
        
        <form action="/pacientes/criar" method="POST">
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
            </div>
            
            <br>
            
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Ex: 28" required>
            </div>
            
            <br>
            
            <div>
                <label for="sintomas">Sintomas/Observações:</label>
                <textarea id="sintomas" name="sintomas" rows="4" placeholder="Descreva os sintomas aqui..." required></textarea>
            </div>
            
            <br>
            
            <button type="submit">Cadastrar Paciente</button>
        </form>
        
        <br>
        <a href="/index.html">⬅ Voltar para o Início</a>
    </main>
</body>
</html>
